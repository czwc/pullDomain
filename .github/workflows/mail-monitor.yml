name: Mail sold monitor

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r mail_monitor/requirements.txt

      - name: Check mail and notify WeChat
        working-directory: mail_monitor
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          SERVERCHAN_SENDKEYS: ${{ secrets.SERVERCHAN_SENDKEYS }}
          CHECK_SINCE_HOURS: ${{ vars.CHECK_SINCE_HOURS || secrets.CHECK_SINCE_HOURS }}
        run: python mail_monitor.py

      - name: Save notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mail_monitor/notified_ids.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: update mail monitor state"
          git push origin HEAD:main
